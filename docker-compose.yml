services:
  mongodb:
    image: mongo:8
    container_name: guvi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: guvi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
